name: Build Custom Images (amd64 + arm64)

env:
  IMAGE_TAG: "2.0.7-beta-custom.1"

on:
  push:
    branches:
      - main
    paths:
      - 'springboot-backend/**'
      - 'vite-frontend/**'
      - '.github/workflows/docker-build-custom.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag'
        required: false
        default: '2.0.7-beta-custom.1'

jobs:
  build:
    name: Build & Push ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: springboot-backend
            context: ./springboot-backend
          - component: vite-frontend
            context: ./vite-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ env.IMAGE_TAG }}"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "repo=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
